<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Converter</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ededed; --panel: #fff; --canvas: #fafafa; --line: rgba(0,0,0,.07);
    --text: #1a1a1a; --muted: #8a8a8e; --fill: #f2f2f2; --fill2: #e9e9e9; --thumb: #fff;
    --ink: #1a1a1a; --ink-text: #fff; --ok: #1f9d55; --danger: #e5352b;
    --shadow: 0 0 0 .5px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    --shadow-pop: 0 0 0 .5px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.06), 0 14px 36px rgba(0,0,0,.12);
    --ease-out: cubic-bezier(.23, 1, .32, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0c; --panel: #1b1b1d; --canvas: #151516; --line: rgba(255,255,255,.08);
      --text: #f2f2f3; --muted: #8e8e93; --fill: #28282a; --fill2: #333336; --thumb: #48484b;
      --ink: #f2f2f3; --ink-text: #111; --ok: #34c76b; --danger: #ff5a4f;
      --shadow: 0 0 0 .5px rgba(255,255,255,.06), 0 8px 24px rgba(0,0,0,.35);
      --shadow-pop: 0 0 0 .5px rgba(255,255,255,.09), 0 14px 36px rgba(0,0,0,.55);
    }
  }
  @media (prefers-reduced-transparency: reduce) { .pop { backdrop-filter: none !important; } }
  @media (prefers-contrast: more) { :root { --line: currentColor; --muted: var(--text); } }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 12.5px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; cursor: default;
  }
  input { user-select: text; -webkit-user-select: text; font: inherit; color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  i[data-icon] { display: inline-flex; flex: none; }
  svg { display: block; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: 224px minmax(0, 1fr) 244px; gap: 10px; height: 100%; padding: 10px; }
  .surface { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); min-height: 0; }
  .side, .panel { display: flex; flex-direction: column; padding: 12px; }
  .stage { position: relative; display: flex; flex-direction: column; background: var(--canvas); padding: 12px; }

  /* ---------- shared controls ---------- */
  .press { transition: transform 160ms ease-out, background-color 150ms ease, opacity 150ms ease; }
  .press:active { transform: scale(.97); }
  .seg { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); padding: 3px; background: var(--fill); border-radius: 11px; }
  .seg .thumb {
    position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / var(--n));
    background: var(--thumb); border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.1), 0 0 0 .5px rgba(0,0,0,.05);
    transform: translateX(calc(var(--i) * 100%)); transition: transform 220ms var(--ease-out);
  }
  .seg[data-instant] .thumb { transition: none; }
  .seg button { position: relative; z-index: 1; height: 26px; padding: 0 6px; background: none; border: 0; border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--muted); transition: color 150ms ease, transform 160ms ease-out; }
  .seg button:active { transform: scale(.97); }
  .seg button[aria-checked=true] { color: var(--text); }
  .seg button:focus-visible, .btn:focus-visible, .icon-btn:focus-visible, .tile:focus-visible, .row:focus-visible, .menu button:focus-visible { outline: 2px solid var(--ok); outline-offset: 1px; }
  .seg.disabled, .tiles.disabled { opacity: .5; pointer-events: none; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; background: var(--fill2); border: 0; border-radius: 10px; font-weight: 500; }
  .icon-btn { display: grid; place-items: center; width: 30px; height: 30px; background: none; border: 0; border-radius: 9px; color: var(--text); }
  .kbd { padding: 1px 5px; background: var(--fill); border-radius: 5px; color: var(--muted); font-size: 10.5px; }
  @media (hover: hover) and (pointer: fine) {
    .btn:hover { background: color-mix(in srgb, var(--fill2) 80%, var(--text) 8%); }
    .icon-btn:hover { background: var(--fill); }
  }

  /* ---------- left: library ---------- */
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 2px 14px; }
  .logo { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--ink-text); }
  .brand b { display: block; font-size: 13.5px; font-weight: 650; letter-spacing: -.01em; line-height: 1.2; }
  .brand small { color: var(--muted); font-size: 11.5px; }
  .list { flex: 1; min-height: 0; margin: 12px -4px 10px; padding: 0 4px; overflow-y: auto; scrollbar-width: thin; }
  .row { display: flex; align-items: center; gap: 9px; width: 100%; height: 34px; padding: 0 9px; background: none; border: 0; border-radius: 9px; text-align: left; animation: rise 260ms var(--ease-out) backwards; }
  .row.fresh { background: var(--fill); }
  .row .ico { color: var(--muted); }
  .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .row .go { display: none; color: var(--muted); }
  @media (hover: hover) and (pointer: fine) {
    .row:hover { background: var(--fill); }
    .row:hover .meta { display: none; }
    .row:hover .go { display: block; }
  }
  .row:active { transform: scale(.985); }
  .empty-note { padding: 18px 8px; color: var(--muted); text-align: center; line-height: 1.5; }
  .filter { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; color: var(--muted); background: var(--fill); border-radius: 10px; }
  .filter input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; color: var(--text); }
  .filter input::placeholder { color: var(--muted); }

  /* ---------- center: stage ---------- */
  .toolbar { align-self: center; display: flex; align-items: center; gap: 4px; padding: 4px; background: var(--panel); border-radius: 13px; box-shadow: var(--shadow); }
  .toolbar .sep { width: 1px; height: 18px; margin: 0 4px; background: var(--line); }
  .toolbar .label { padding: 0 8px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .hero { flex: 1; min-height: 0; display: grid; place-items: center; overflow-y: auto; padding: 14px 4px; }
  .hero > * { display: none; }
  .hero[data-view=empty] .empty, .hero[data-view=results] .results, .hero[data-view=preview] .preview { display: flex; animation: rise 280ms var(--ease-out); }

  .empty { flex-direction: column; align-items: center; max-width: 300px; text-align: center; }
  .empty .glyph { display: grid; place-items: center; width: 68px; height: 68px; margin-bottom: 16px; background: var(--panel); border-radius: 22px; box-shadow: var(--shadow); color: var(--text); }
  .empty h2 { margin: 0 0 6px; font-size: 16px; font-weight: 650; letter-spacing: -.015em; }
  .empty p { margin: 0; color: var(--muted); line-height: 1.55; }

  .preview { flex-direction: column; align-items: center; width: min(430px, 100%); text-align: center; }
  .shot { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--fill); border-radius: 20px; box-shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 18px 44px rgba(0,0,0,.14); }
  .shot img { width: 100%; height: 100%; object-fit: cover; }
  .preview h2 { margin: 16px 0 3px; max-width: 100%; font-size: 15px; font-weight: 650; letter-spacing: -.012em; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .preview .by { margin: 0; color: var(--muted); }
  .status { min-height: 44px; margin-top: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; width: 100%; }
  .bar { width: min(280px, 80%); height: 4px; overflow: hidden; background: var(--fill2); border-radius: 99px; }
  .bar > div { height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width 300ms var(--ease-out); }
  .bar.wait > div { width: 35%; animation: slide 1.1s ease-in-out infinite; }
  .status .line { color: var(--muted); font-variant-numeric: tabular-nums; }
  .saved { display: inline-flex; align-items: center; gap: 9px; padding: 5px 5px 5px 8px; background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); font-weight: 500; }
  .saved .check { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--ok); color: #fff; }

  .results { flex-direction: column; width: min(480px, 100%); padding: 6px; background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); max-height: 100%; overflow-y: auto; }
  .pickrow { display: flex; align-items: center; gap: 11px; width: 100%; padding: 7px; background: none; border: 0; border-radius: 11px; text-align: left; }
  .pickrow img { width: 88px; height: 50px; object-fit: cover; border-radius: 8px; flex: none; background: var(--fill); }
  .pickrow b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; line-height: 1.3; }
  .pickrow small { display: block; margin-top: 2px; color: var(--muted); }
  @media (hover: hover) and (pointer: fine) { .pickrow:hover { background: var(--fill); } }

  .note { min-height: 20px; margin: 0 4px 8px; text-align: center; color: var(--muted); }
  .note.err { color: var(--danger); }

  /* composer */
  .composer { position: relative; align-self: center; width: min(560px, 100%); padding: 12px 12px 10px; background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); }
  .composer input { width: 100%; height: 28px; padding: 0 4px; background: none; border: 0; outline: none; font-size: 14px; }
  .composer input::placeholder { color: var(--muted); }
  .composer input:disabled { opacity: .5; }
  .composer .bar-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .composer .plus { width: 30px; border: .5px solid var(--line); background: var(--panel); }
  .chip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; background: var(--panel); border: .5px solid var(--line); border-radius: 10px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .chip .spark { color: var(--ok); }
  .chip .chev { color: var(--muted); }
  .spacer { flex: 1; }
  .submit { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; background: var(--fill2); color: var(--muted); border: 0; border-radius: 50%; }
  .submit.ready { background: var(--ink); color: var(--ink-text); }
  @media (hover: hover) and (pointer: fine) { .chip:hover, .composer .plus:hover { background: var(--fill); } }

  /* popovers: scale from their trigger, never from nothing */
  .pop { position: absolute; bottom: calc(100% + 8px); min-width: 224px; padding: 5px; background: var(--panel); border-radius: 13px; box-shadow: var(--shadow-pop); opacity: 0; visibility: hidden; pointer-events: none; transform: scale(.95); transform-origin: bottom left; transition: opacity 140ms ease-out, transform 140ms var(--ease-out), visibility 0s linear 140ms; z-index: 5; }
  .pop[data-open] { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition-delay: 0s; }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 10px; background: none; border: 0; border-radius: 8px; text-align: left; font-weight: 500; }
  .menu button .ico { color: var(--muted); }
  .menu button .tick { margin-left: auto; color: var(--ok); opacity: 0; }
  .menu button[aria-checked=true] .tick { opacity: 1; }
  .menu hr { margin: 4px 6px; border: 0; border-top: .5px solid var(--line); }
  @media (hover: hover) and (pointer: fine) { .menu button:hover { background: var(--fill); } }
  #popPlus { left: 12px; }
  #popQual { left: 52px; }

  /* ---------- right: settings ---------- */
  .group { margin-top: 18px; }
  .group h3 { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 8px; color: var(--muted); font-size: 12px; font-weight: 500; }
  .group h3 span { font-variant-numeric: tabular-nums; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tile { display: flex; flex-direction: column; justify-content: space-between; gap: 14px; height: 74px; padding: 10px; text-align: left; background: var(--fill); border: 0; border-radius: 13px; box-shadow: inset 0 0 0 1.5px transparent; transition: transform 160ms ease-out, box-shadow 160ms ease-out, background-color 150ms ease; }
  .tile:active { transform: scale(.97); }
  .tile[aria-checked=true] { background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .tile b { display: block; font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; line-height: 1.1; }
  .tile small { color: var(--muted); font-size: 11px; }
  .levels { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
  .levels i { width: 3px; border-radius: 1px; background: var(--fill2); }
  .levels i.on { background: var(--ink); }
  .tile[aria-checked=false] .levels i.on { background: var(--muted); }
  @media (hover: hover) and (pointer: fine) { .tile[aria-checked=false]:hover { background: var(--fill2); } }
  .out { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 5px 0 10px; background: var(--fill); border-radius: 11px; }
  .out .ico { color: var(--muted); }
  .out span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .out .icon-btn { width: 26px; height: 26px; background: var(--panel); border-radius: 8px; }
  .hint { margin: 0; color: var(--muted); font-size: 11.5px; line-height: 1.5; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -4px; padding: 0 4px 4px; scrollbar-width: thin; }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

  @media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr) 244px; } .side { display: none; } }
  @media (max-width: 640px) { body { overflow: auto; } .app { grid-template-columns: 1fr; height: auto; } .stage { min-height: 560px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-property: opacity, color, background-color !important; }
    .seg .thumb { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Library -->
  <aside class="side surface" aria-label="Library">
    <div class="brand">
      <div class="logo"><i data-icon="logo"></i></div>
      <div><b>Local Converter</b><small>Audio, video &amp; karaoke</small></div>
    </div>
    <div class="seg" id="libTabs" role="radiogroup" aria-label="Library filter" style="--n:3">
      <div class="thumb"></div>
      <button type="button" role="radio" data-value="all">All</button>
      <button type="button" role="radio" data-value="mp3">Audio</button>
      <button type="button" role="radio" data-value="mp4">Video</button>
    </div>
    <div class="list" id="library" role="list"></div>
    <label class="filter"><i data-icon="search"></i><input id="filter" type="text" placeholder="Filter library" autocomplete="off" spellcheck="false"><span class="kbd">⌘F</span></label>
  </aside>

  <!-- Stage -->
  <main class="stage surface">
    <div class="toolbar" role="toolbar" aria-label="Quick actions">
      <button class="icon-btn press" id="tbPaste" type="button" title="Paste link from clipboard" aria-label="Paste link from clipboard"><i data-icon="clip"></i></button>
      <button class="icon-btn press" id="tbSearch" type="button" title="Search YouTube" aria-label="Search YouTube"><i data-icon="search"></i></button>
      <span class="sep"></span>
      <span class="label" id="tbLabel"></span>
      <span class="sep"></span>
      <button class="btn press" id="tbGo" type="button">Convert</button>
    </div>

    <section class="hero" id="hero" data-view="empty">
      <div class="empty">
        <div class="glyph"><i data-icon="download-lg"></i></div>
        <h2>Paste a link to begin</h2>
        <p>Copy a YouTube link and press ⌘V, or type a song name to search.</p>
      </div>
      <div class="results" id="results" role="list"></div>
      <div class="preview">
        <div class="shot"><img id="pimg" alt=""></div>
        <h2 id="ptitle"></h2>
        <p class="by" id="pby"></p>
        <div class="status" id="status"></div>
      </div>
    </section>

    <p class="note" id="note" aria-live="polite"></p>

    <div class="composer">
      <input id="q" type="text" placeholder="Paste a link or type a song name…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="YouTube link or song name">
      <div class="bar-row">
        <button class="icon-btn plus press" id="plus" type="button" aria-label="More" aria-haspopup="menu"><i data-icon="plus"></i></button>
        <button class="chip press" id="chip" type="button" aria-haspopup="menu"><i data-icon="spark" class="spark"></i><span id="chipLabel"></span><i data-icon="chev" class="chev"></i></button>
        <span class="spacer"></span>
        <button class="submit press" id="submit" type="button" aria-label="Convert"></button>
      </div>
      <div class="pop menu" id="popPlus" role="menu">
        <button type="button" role="menuitem" data-act="paste"><i data-icon="clip" class="ico"></i>Paste from clipboard</button>
        <button type="button" role="menuitem" data-act="search"><i data-icon="search" class="ico"></i>Search YouTube</button>
        <hr>
        <button type="button" role="menuitem" data-act="folder"><i data-icon="folder" class="ico"></i>Open downloads folder</button>
      </div>
      <div class="pop menu" id="popQual" role="menu"></div>
    </div>
  </main>

  <!-- Settings -->
  <aside class="panel surface" aria-label="Settings">
    <div class="seg" id="fmt" role="radiogroup" aria-label="Mode" style="--n:3">
      <div class="thumb"></div>
      <button type="button" role="radio" data-value="mp3">MP3</button>
      <button type="button" role="radio" data-value="mp4">MP4</button>
      <button type="button" role="radio" data-value="karaoke">Cut vocal</button>
    </div>
    <div class="scroll">
      <div class="group">
        <h3><b id="qName" style="font-weight:500"></b><span id="qNow"></span></h3>
        <div class="tiles" id="tiles" role="radiogroup" aria-labelledby="qName"></div>
      </div>
      <div class="group">
        <h3>Save to</h3>
        <div class="out"><i data-icon="folder" class="ico"></i><span title="~/Downloads/YT Converter">Downloads/YT Converter</span><button class="icon-btn press" id="openFolder" type="button" title="Open folder" aria-label="Open downloads folder"><i data-icon="reveal"></i></button></div>
      </div>
      <div class="group">
        <h3>About this setting</h3>
        <p class="hint" id="hint"></p>
      </div>
    </div>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);

// ---------- icons (20×20, stroke) ----------
const ICONS = {
  logo: '<path d="M10 3.5v9M6.5 9.2 10 12.7l3.5-3.5M4.5 16h11"/>',
  "download-lg": '<path d="M10 3.5v9M6.5 9.2 10 12.7l3.5-3.5M4.5 16h11"/>',
  search: '<circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.3 3.3"/>',
  clip: '<rect x="4.5" y="5" width="11" height="11.5" rx="2"/><rect x="7.5" y="3" width="5" height="3.5" rx="1.2"/><path d="M7.5 10.5h5M7.5 13h3"/>',
  plus: '<path d="M10 4.5v11M4.5 10h11"/>',
  chev: '<path d="m6 8 4 4 4-4"/>',
  up: '<path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9"/>',
  stop: '<rect x="6" y="6" width="8" height="8" rx="1.5" fill="currentColor"/>',
  check: '<path d="m4.5 10.5 3.5 3.5 7.5-8"/>',
  spark: '<path d="M10 3v4M10 13v4M3 10h4M13 10h4M5.5 5.5l2 2M12.5 12.5l2 2M14.5 5.5l-2 2M7.5 12.5l-2 2"/>',
  music: '<path d="M8 14.5V5.5l7-1.5v9"/><circle cx="6.2" cy="14.5" r="1.8"/><circle cx="13.2" cy="13" r="1.8"/>',
  film: '<rect x="3.5" y="4.5" width="13" height="11" rx="2"/><path d="M3.5 8.5h13M3.5 11.5h13M7.5 4.5v11M12.5 4.5v11"/>',
  folder: '<path d="M3.5 6.5a1.5 1.5 0 0 1 1.5-1.5h3l1.5 1.8H15a1.5 1.5 0 0 1 1.5 1.5v5.7A1.5 1.5 0 0 1 15 15.5H5a1.5 1.5 0 0 1-1.5-1.5z"/>',
  reveal: '<path d="M7 13 13 7M8 6.5h5.5V12"/>',
};
function svg(name, size) {
  const px = size || (name === "download-lg" ? 28 : 16);
  return `<svg width="${px}" height="${px}" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
}
function hydrateIcons(root) { (root || document).querySelectorAll("i[data-icon]").forEach(el => { el.innerHTML = svg(el.dataset.icon); }); }

// ---------- options ----------
const AUDIO = [
  { value: 128, label: "128", unit: "kbps", caption: "Compact", level: 1 },
  { value: 192, label: "192", unit: "kbps", caption: "Balanced", level: 2 },
  { value: 256, label: "256", unit: "kbps", caption: "High", level: 3 },
  { value: 320, label: "320", unit: "kbps", caption: "Maximum", level: 4 },
];
const VIDEO = [
  { value: 360, label: "360p", caption: "Small", level: 1 },
  { value: 480, label: "480p", caption: "Standard", level: 2 },
  { value: 720, label: "720p", caption: "HD", level: 3 },
  { value: 1080, label: "1080p", caption: "Full HD", level: 4 },
  { value: 1440, label: "1440p", caption: "2K · VP9", level: 5 },
  { value: 2160, label: "4K", caption: "Ultra · VP9", level: 6 },
];
const HINTS = {
  karaoke: "Remove vocals and keep the backing music for karaoke or covers. Saves an instrumental MP3. Separation can take several minutes; the first run downloads the AI model. Some vocals or artifacts may remain.",
  mp3: "YouTube's own audio tops out near 160 kbps. 256 and 320 make larger files but add no extra detail, so 192 is a good balance.",
  mp4: "Up to 1080p uses H.264 and plays everywhere, including QuickTime. 1440p and 4K use VP9 and may need a player like VLC. If a video lacks your pick, the next lower resolution is used.",
};
const FORMATS = [{ value: "mp3" }, { value: "mp4" }, { value: "karaoke" }];
const LIB_TABS = [{ value: "all" }, { value: "mp3" }, { value: "mp4" }];

const state = {
  format: "mp3", audio_kbps: 192, video_height: 1080,
  busy: false, job: null, pick: null, library: [], libTab: "all", libFilter: "", fresh: null, libAnimated: false,
};
let pollTimer = null, infoTimer = null, infoSeq = 0;

const q = $("q");
const qualityOptions = () => state.format === "mp4" ? VIDEO : AUDIO;
const qualityValue = () => state.format === "mp4" ? state.video_height : state.audio_kbps;
const currentOption = () => qualityOptions().find(o => o.value === qualityValue());
const optionText = o => o ? (o.unit ? `${o.label} ${o.unit}` : o.label) : "";
const isLink = v => /^https?:\/\//i.test(v.trim());
const tidy = m => String(m).replace(/^ERROR:\s*(\[[^\]]+\]\s*[\w-]+:\s*)?/, "");

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
const saveSettings = () => post("/api/settings", { format: state.format, audio_kbps: state.audio_kbps, video_height: state.video_height }).catch(() => {});
const mmss = s => s ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : "";

// ---------- segmented control ----------
function markSeg(el, options, selected) {
  const index = Math.max(0, options.findIndex(o => o.value === selected));
  el.style.setProperty("--i", index);
  el.querySelectorAll("button").forEach((b, i) => { b.setAttribute("aria-checked", i === index); b.tabIndex = i === index ? 0 : -1; });
}
function wireSeg(el, options, getValue, onSelect) {
  el.querySelectorAll("button").forEach(b => b.onclick = () => onSelect(b.dataset.value));
  el.addEventListener("keydown", e => {
    if (!["ArrowLeft", "ArrowRight"].includes(e.key)) return;
    e.preventDefault();
    const i = options.findIndex(o => String(o.value) === String(getValue()));
    const next = options[(i + (e.key === "ArrowRight" ? 1 : -1) + options.length) % options.length];
    el.dataset.instant = "1";               // keyboard-driven: no animation
    onSelect(String(next.value));
    el.querySelector("[aria-checked=true]")?.focus();
    requestAnimationFrame(() => delete el.dataset.instant);
  });
}

// ---------- settings rendering ----------
function renderTiles() {
  const opts = qualityOptions(), box = $("tiles");
  box.replaceChildren();
  for (const o of opts) {
    const tile = document.createElement("button");
    tile.type = "button"; tile.className = "tile"; tile.setAttribute("role", "radio");
    tile.setAttribute("aria-checked", o.value === qualityValue());
    const levels = document.createElement("div"); levels.className = "levels";
    for (let i = 1; i <= opts.length; i++) {
      const bar = document.createElement("i"); bar.style.height = (4 + i * (10 / opts.length)) + "px";
      if (i <= o.level) bar.className = "on";
      levels.append(bar);
    }
    const text = document.createElement("div");
    const big = document.createElement("b"); big.textContent = o.label;
    if (o.unit) { const u = document.createElement("small"); u.textContent = " " + o.unit; big.append(u); }
    const cap = document.createElement("small"); cap.textContent = o.caption;
    text.append(big, cap); tile.append(levels, text);
    tile.onclick = () => setQuality(o.value);
    box.append(tile);
  }
}
function renderMenuQuality() {
  const pop = $("popQual"); pop.replaceChildren();
  for (const o of qualityOptions()) {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "menuitemradio"); b.setAttribute("aria-checked", o.value === qualityValue());
    b.innerHTML = `<span>${optionText(o)}</span><small style="color:var(--muted);font-weight:400">${o.caption}</small><i class="tick">${svg("check")}</i>`;
    b.onclick = () => { setQuality(o.value); closePops(); };
    pop.append(b);
  }
}
function renderSettings() {
  markSeg($("fmt"), FORMATS, state.format);
  $("qName").textContent = state.format === "mp4" ? "Resolution" : "Sound quality";
  $("qNow").textContent = optionText(currentOption());
  $("hint").textContent = HINTS[state.format];
  renderTiles(); renderMenuQuality();
  const label = `${state.format === "karaoke" ? "Instrumental" : state.format === "mp3" ? "Audio" : "Video"} · ${optionText(currentOption())}`;
  $("chipLabel").textContent = label;
  $("tbLabel").textContent = `${state.format === "karaoke" ? "Cut vocal" : state.format.toUpperCase()} · ${optionText(currentOption())}`;
  renderSubmit();
}
function setFormat(value) { if (state.busy) return; state.format = value; saveSettings(); renderSettings(); }
function setQuality(value) {
  if (state.busy) return;
  if (state.format !== "mp4") state.audio_kbps = Number(value); else state.video_height = Number(value);
  saveSettings(); renderSettings();
}

// ---------- composer / submit ----------
function renderSubmit() {
  const btn = $("submit"), has = q.value.trim().length > 0;
  btn.innerHTML = svg(state.busy ? "stop" : "up", 16);
  btn.classList.toggle("ready", state.busy || has);
  const label = state.busy ? "Cancel" : !has ? "Convert" : isLink(q.value) ? "Convert" : "Search";
  btn.setAttribute("aria-label", label);
  $("tbGo").textContent = state.busy ? "Cancel" : "Convert";
}
function setBusy(busy) {
  state.busy = busy;
  q.disabled = busy;
  ["fmt"].forEach(id => $(id).classList.toggle("disabled", busy));
  $("tiles").classList.toggle("disabled", busy);
  renderSubmit();
}

// ---------- hero ----------
const hero = $("hero");
const setView = v => { if (hero.dataset.view !== v) hero.dataset.view = v; };
function setNote(text, isError) { const n = $("note"); n.textContent = text ? tidy(text) : ""; n.classList.toggle("err", !!isError); }
function clearStatus() { $("status").replaceChildren(); }

function setPick(item) {
  state.pick = item;
  const img = $("pimg");
  img.removeAttribute("data-fb");
  img.onerror = img.onload = null;
  if (item.id) {
    const fallback = `https://i.ytimg.com/vi/${item.id}/mqdefault.jpg`;
    const useFallback = () => { if (!img.dataset.fb) { img.dataset.fb = "1"; img.src = fallback; } };
    img.onerror = useFallback;
    img.onload = () => { if (img.naturalWidth <= 120) useFallback(); };   // YouTube serves a 120px stub when maxres is missing
    img.src = `https://i.ytimg.com/vi/${item.id}/maxresdefault.jpg`;
    img.style.visibility = "visible";
  } else { img.removeAttribute("src"); img.style.visibility = "hidden"; }
  $("ptitle").textContent = item.title || "Loading…";
  $("pby").textContent = [item.channel, mmss(item.duration)].filter(Boolean).join(" · ");
  setView("preview");
}
function clearPick() { state.pick = null; clearStatus(); setView(hero.dataset.view === "results" ? "results" : "empty"); }

function setProgress(percent, stage) {
  const s = $("status");
  let bar = s.querySelector(".bar"), line = s.querySelector(".line");
  if (!bar) {
    s.replaceChildren();
    bar = document.createElement("div"); bar.className = "bar"; bar.setAttribute("role", "progressbar");
    bar.append(document.createElement("div"));
    line = document.createElement("div"); line.className = "line";
    s.append(bar, line);
  }
  bar.classList.toggle("wait", !percent);
  bar.firstChild.style.width = percent ? percent + "%" : "";
  bar.setAttribute("aria-valuenow", Math.round(percent || 0));
  line.textContent = percent ? `${stage} ${Math.round(percent)}%` : stage;
}
function showDone(job) {
  setBusy(false);
  const s = $("status"); s.replaceChildren();
  const wrap = document.createElement("div"); wrap.className = "saved";
  wrap.innerHTML = `<span class="check">${svg("check", 12)}</span><span>Saved to Downloads</span>`;
  const btn = document.createElement("button"); btn.type = "button"; btn.className = "btn press"; btn.textContent = /Win/.test(navigator.platform) ? "Show in folder" : "Show in Finder";
  btn.onclick = () => reveal(job.filename);
  wrap.append(btn); s.append(wrap);
  state.fresh = job.filename;
  loadLibrary();
}
function showError(text) { setBusy(false); clearStatus(); setNote(text, true); }

// ---------- library ----------
const reveal = name => post("/api/reveal", { name }).catch(e => setNote(e.message, true));
async function loadLibrary() { try { state.library = (await api("/api/library")).items; } catch (_) {} renderLibrary(); }
function renderLibrary() {
  const box = $("library"); box.replaceChildren();
  const term = state.libFilter.trim().toLowerCase();
  const items = state.library.filter(i => (state.libTab === "all" || i.kind === state.libTab) && (!term || i.title.toLowerCase().includes(term)));
  if (!items.length) {
    const n = document.createElement("div"); n.className = "empty-note";
    n.textContent = state.library.length ? "No matches." : "Your conversions will appear here.";
    return box.append(n);
  }
  items.forEach((item, i) => {
    const row = document.createElement("button");
    row.type = "button"; row.className = "row press" + (item.name === state.fresh ? " fresh" : ""); row.setAttribute("role", "listitem");
    row.title = item.name;
    if (state.libAnimated) row.style.animation = "none";
    else row.style.animationDelay = Math.min(i, 8) * 35 + "ms";          // short stagger, first paint only
    const ico = document.createElement("i"); ico.className = "ico"; ico.innerHTML = svg(item.kind === "mp3" ? "music" : "film");
    const name = document.createElement("span"); name.className = "name"; name.textContent = item.title;
    const meta = document.createElement("span"); meta.className = "meta"; meta.textContent = item.quality;
    const go = document.createElement("i"); go.className = "go"; go.innerHTML = svg("reveal");
    row.append(ico, name, meta, go);
    row.onclick = () => reveal(item.name);
    box.append(row);
  });
  state.libAnimated = true;
}

// ---------- convert / search ----------
async function convert(url) {
  setNote(""); clearStatus();
  if (!state.pick) setPick({ id: null, title: url, url });
  state.job = null;
  setBusy(true); setProgress(0, "Starting…");
  try {
    const { id } = await post("/api/jobs", { url, format: state.format, quality: qualityValue() });
    state.job = id; poll(id);
  } catch (e) { showError(e.message); }
}
function poll(id) {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    try {
      const job = await api("/api/jobs/" + id);
      if (job.state === "done") return showDone(job);
      if (job.state === "error") return showError(job.error);
      if (job.state === "cancelled") { setBusy(false); clearStatus(); return setNote("Cancelled."); }
      if (job.state === "converting") setProgress(job.percent, "Converting…");
      else if (job.state === "separating") setProgress(0, "Removing vocals… This can take several minutes.");
      else if (job.state === "downloading") setProgress(job.percent, "Downloading…");
      else setProgress(0, "Starting…");
      poll(id);
    } catch (e) { showError(e.message); }
  }, 500);
}
function cancel() {
  clearTimeout(pollTimer);
  if (state.job) post("/api/jobs/" + state.job + "/cancel", {}).catch(() => {});
  setBusy(false); clearStatus(); setNote("Cancelled.");
}
async function search(term) {
  setNote(""); state.job = null; setBusy(true);
  try {
    const { results } = await api("/api/search?q=" + encodeURIComponent(term));
    const box = $("results"); box.replaceChildren();
    if (!results.length) setNote("No results.");
    for (const item of results) {
      const row = document.createElement("button");
      row.type = "button"; row.className = "pickrow press"; row.setAttribute("role", "listitem");
      const img = Object.assign(document.createElement("img"), { src: item.thumbnail, alt: "" });
      const text = document.createElement("div");
      const title = document.createElement("b"); title.textContent = item.title;
      const meta = document.createElement("small"); meta.textContent = [item.channel, mmss(item.duration)].filter(Boolean).join(" · ");
      text.append(title, meta); row.append(img, text);
      row.onclick = () => { q.value = item.url; clearStatus(); setPick(item); renderSubmit(); };
      box.append(row);
    }
    if (results.length) { state.pick = null; setView("results"); }
  } catch (e) { setNote(e.message, true); }
  setBusy(false); q.focus();
}

function run() {
  closePops();
  if (state.busy) return cancel();
  const v = q.value.trim();
  if (!v) return q.focus();
  isLink(v) ? convert(v) : search(v);
}

// preview a pasted link as soon as it looks like one
function onInput() {
  renderSubmit();
  if (state.busy) return;
  clearTimeout(infoTimer);
  const v = q.value.trim();
  if (!isLink(v)) { if (state.pick) clearPick(); return; }
  infoTimer = setTimeout(async () => {
    const seq = ++infoSeq;
    try {
      const info = await api("/api/info?url=" + encodeURIComponent(v));
      if (seq !== infoSeq || state.busy) return;
      setNote(""); clearStatus(); setPick(info);
    } catch (e) { if (seq === infoSeq) setNote("That doesn't look like a single-video link."); }
  }, 220);
}

// ---------- popovers ----------
const pops = [$("popPlus"), $("popQual")];
function closePops() { pops.forEach(p => p.removeAttribute("data-open")); }
function togglePop(pop) { const open = pop.hasAttribute("data-open"); closePops(); if (!open) pop.setAttribute("data-open", ""); }
$("plus").onclick = e => { e.stopPropagation(); togglePop($("popPlus")); };
$("chip").onclick = e => { e.stopPropagation(); togglePop($("popQual")); };
document.addEventListener("pointerdown", e => { if (!e.target.closest(".pop, #plus, #chip")) closePops(); });

async function pasteClipboard() {
  closePops();
  try {
    const t = (await navigator.clipboard.readText()).trim();
    if (t) { q.value = t; onInput(); }
  } catch (_) { setNote("Click the box and press ⌘V to paste."); }
  q.focus();
}
function focusSearch() { closePops(); q.focus(); q.select(); }
$("popPlus").addEventListener("click", e => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "paste") pasteClipboard();
  if (act === "search") focusSearch();
  if (act === "folder") { closePops(); post("/api/reveal", {}).catch(() => {}); }
});
$("tbPaste").onclick = pasteClipboard;
$("tbSearch").onclick = focusSearch;
$("openFolder").onclick = () => post("/api/reveal", {}).catch(() => {});
$("tbGo").onclick = run;
$("submit").onclick = run;

// ---------- wiring ----------
q.addEventListener("input", onInput);
q.addEventListener("keydown", e => { if (e.key === "Enter") run(); });
$("filter").addEventListener("input", e => { state.libFilter = e.target.value; renderLibrary(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (pops.some(p => p.hasAttribute("data-open"))) return closePops(); if (state.busy) cancel(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") { e.preventDefault(); $("filter").focus(); }
});
wireSeg($("fmt"), FORMATS, () => state.format, setFormat);
wireSeg($("libTabs"), LIB_TABS, () => state.libTab, v => { state.libTab = v; markSeg($("libTabs"), LIB_TABS, v); renderLibrary(); });

hydrateIcons();
markSeg($("libTabs"), LIB_TABS, state.libTab);
renderSettings();
renderLibrary();
q.focus();
(async () => {
  try { Object.assign(state, await api("/api/settings")); renderSettings(); } catch (_) {}
  loadLibrary();
})();
</script>
</body>
</html>
